# F6 — the un-forgeable finish line (GitLab). Re-runs the deterministic floor on the MR's exact
# head commit, server-side. Mirror of .github/workflows/ci.yml — both call scripts/ci-verify.sh
# so the check is identical across hosts.
#
# To make this BLOCK the merge button (the actual gate): Settings → Merge requests →
# "Pipelines must succeed". One-time human step (a human owns the merge boundary).
stages: [verify, sync]

variables:
  GIT_DEPTH: "0"   # full history so the routing-assertion can diff against the base

verify:
  stage: verify
  image: node:22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - npm ci
    - bash scripts/ci-verify.sh

# Rebase open MRs that conflict with main after a merge lands on main.
# Gated on $GITLAB_TOKEN — a missing variable skips this job instead of breaking the pipeline.
# Set GITLAB_TOKEN in project CI variables with MR-write permissions to enable syncing.
sync-prs:
  stage: sync
  image: node:22
  rules:
    - if: '$GITLAB_TOKEN && $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  script:
    - npm ci
    - bash scripts/sync-open-prs.sh
